use_default_settings: true

server:
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: 0.0.0.0
  workers: 2

search:
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: true
  infinite_scroll: true
  results_on_new_tab: false
  default_locale: en
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  useragent_suffix: "Odysseus/1.0"
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: google
    engine: google
    use_mobile_ui: true
    disabled: false

  - name: bing
    engine: bing
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    disabled: false

  - name: brave
    engine: brave
    disabled: false

  - name: qwant
    engine: qwant
    disabled: false

  - name: mojeek
    engine: mojeek
    disabled: false

  - name: wikipedia
    engine: wikipedia
    disabled: false

  - name: arxiv
    engine: arxiv
    disabled: false

  - name: google scholar
    engine: google_scholar
    disabled: false

  - name: semanticscholar
    engine: semanticscholar
    disabled: false

  - name: pubmed
    engine: pubmed
    disabled: false

  - name: github
    engine: github
    disabled: false

  - name: gitlab
    engine: gitlab
    disabled: false

  - name: stackoverflow
    engine: stackexchange
    disabled: false

  - name: hackernews
    engine: hackernews
    disabled: false

  - name: reddit
    engine: reddit
    disabled: false

  - name: google news
    engine: google_news
    disabled: false

  - name: youtube
    engine: youtube
    disabled: false

  - name: npm
    engine: npm
    disabled: false

  - name: pypi
    engine: pypi
    disabled: false

  - name: docker hub
